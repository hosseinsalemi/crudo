name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    env:
      TARBALL_DIR: /tmp/kavo-tarballs
      # Topological order: every package publishes before anything that
      # depends on it (@kavo/nest last — it has @kavo/core, @kavo/graphql and
      # @kavo/mcp as hard dependencies). npm does not check that a dependency
      # exists at publish time, so the order costs nothing on a clean run; it
      # bounds the blast radius of a failed one. The loop stops at the first
      # failure, and this order guarantees whatever already reached the
      # registry pins only versions that also reached it — the alternative
      # leaves a published @kavo/nest pointing at a sibling that does not
      # exist, uninstallable and, past npm's unpublish window, unfixable.
      # Single source of truth for "which packages get released" — add a new
      # package here only; the coverage guard below fails the release if this
      # list and the workspace disagree.
      PACKAGE_DIRS: >-
        packages/core
        packages/orms/typeorm
        packages/orms/prisma
        packages/orms/mongoose
        packages/protocols/graphql
        packages/protocols/mcp
        packages/frameworks/nest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm's OIDC trusted-publishing exchange needs npm >=11.5.1; the
      # bundled version on some Node builds can lag behind that.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version guards run before `pnpm check`: they are the cheapest
      # steps here and the most likely to fail, and there is nothing to gain
      # from spending a full build on a tag that already cannot ship.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @kavo/core version $PKG_VERSION" >&2
            exit 1
          fi

      # PACKAGE_DIRS is hand-maintained, and every other guard here only sees
      # what it lists — a publishable package missing from it is invisible to
      # all of them, and the release ships dependents pinning a version that
      # was never published. Derive the publishable set from the workspace
      # itself (everything not marked private) and require the two to agree.
      # This adds no second list to keep in sync: PACKAGE_DIRS stays the
      # source of truth for order and membership, and this only refuses to
      # release while it is incomplete.
      - name: Verify PACKAGE_DIRS covers every publishable package
        run: |
          set -o pipefail
          EXPECTED=$(pnpm -r list --depth -1 --json | node -e '
            const { relative } = require("node:path");
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              for (const pkg of JSON.parse(raw)) {
                if (pkg.private !== true) console.log(relative(process.cwd(), pkg.path));
              }
            });
          ' | sort)
          ACTUAL=$(printf "%s\n" $PACKAGE_DIRS | sort)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "PACKAGE_DIRS and the publishable workspace packages disagree:" >&2
            echo "  PACKAGE_DIRS: $(echo $ACTUAL)" >&2
            echo "  workspace:    $(echo $EXPECTED)" >&2
            exit 1
          fi

      # ADR-0004: one version identifies a consumer's whole setup, so every
      # package in PACKAGE_DIRS ships at @kavo/core's version. A package left
      # behind at an older version is otherwise invisible at release time —
      # the tag check above only looks at core, and the publish loop below
      # then finds the stale version already on the registry and prints
      # "already published, skipping". The release goes green having never
      # released that package, which is how @kavo/prisma sat at 0.5.0 while
      # everything else moved to 0.6.0. Fail here, before anything is packed
      # or published.
      - name: Verify lockstep versions
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          status=0
          for dir in $PACKAGE_DIRS; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if [ "$VERSION" = "$CORE_VERSION" ]; then
              echo "$NAME $VERSION"
            else
              echo "$NAME is at $VERSION, expected $CORE_VERSION (ADR-0004 lockstep versioning)" >&2
              status=1
            fi
          done
          exit $status

      # Same gate as CI — a release never ships on a red build. It also
      # builds the `dist/` that the pack step below ships.
      - name: Check
        run: pnpm check

      # `pnpm pack` (not `pnpm publish`) does the packaging: it rewrites
      # workspace:^ deps to a real semver range in the tarball. Publishing
      # itself goes through plain `npm publish`, which has stable, GA OIDC
      # trusted-publishing support — pnpm's own `publish` currently 404s
      # under GitHub Actions OIDC (pnpm/pnpm#11513). No npm token anywhere:
      # each package must have a trusted publisher configured on npmjs.com
      # pointing at this repo + this workflow file.
      - name: Pack packages
        run: |
          mkdir -p "$TARBALL_DIR"
          for dir in $PACKAGE_DIRS; do
            (cd "$dir" && pnpm pack --pack-destination "$TARBALL_DIR")
          done

      # The pack step above is the only thing that turns `workspace:^` into a
      # real semver range, so a tarball that still carries the literal
      # protocol is uninstallable by every package manager (npm fails with
      # EUNSUPPORTEDPROTOCOL, pnpm with ERR_PNPM_WORKSPACE_PKG_NOT_FOUND) —
      # and npm forbids republishing a version, so the mistake can only be
      # fixed by burning a version number. @kavo/prisma@0.5.0 and
      # @kavo/mongoose@0.6.0 both shipped that way. Inspect the packed
      # manifests, not the source ones: the source manifests always say
      # `workspace:^`, which is exactly right in the repo and only wrong on
      # the registry.
      - name: Verify packed manifests resolve workspace deps
        run: |
          status=0
          for tarball in "$TARBALL_DIR"/*.tgz; do
            OFFENDERS=$(tar -xzOf "$tarball" package/package.json | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => (raw += chunk));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(raw);
                for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
                  for (const [name, range] of Object.entries(pkg[field] ?? {})) {
                    if (String(range).includes("workspace:")) console.log(`  ${field}.${name}: ${range}`);
                  }
                }
              });
            ')
            if [ -n "$OFFENDERS" ]; then
              echo "$(basename "$tarball") ships unresolved workspace: ranges and would be uninstallable:" >&2
              echo "$OFFENDERS" >&2
              status=1
            else
              echo "$(basename "$tarball") ok"
            fi
          done
          exit $status

      # Each publish is skipped if that exact name@version is already on
      # the registry, so re-running the job after a partial failure (one
      # package published, a later one failing) doesn't die re-publishing
      # what already succeeded — npm publish itself is not idempotent.
      #
      # The tarball is named exactly, not globbed: `pnpm pack` writes
      # <name-with-@-and-/-flattened>-<version>.tgz, and a `<prefix>-*.tgz`
      # glob would also match a sibling whose name extends this one
      # (`kavo-core-*` matching a future `kavo-core-utils-…`), handing
      # `npm publish` two paths and publishing the wrong package.
      - name: Publish packages
        run: |
          for dir in $PACKAGE_DIRS; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            TARBALL="$TARBALL_DIR/$(echo "$NAME" | sed 's/^@//; s/\//-/')-$VERSION.tgz"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              npm publish "$TARBALL" --access public
            fi
          done

      # Only runs once every publish above succeeded. Attaches the exact
      # published tarballs as release assets and lets GitHub generate the
      # notes from merged PRs since the previous tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            $TARBALL_DIR/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
