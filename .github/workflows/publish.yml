name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    env:
      TARBALL_DIR: /tmp/kavo-tarballs
      # Published in dependency order (core before its dependents) even
      # though publish-time order has no functional effect on npm — it
      # mirrors the package graph per ADR-0004 lockstep versioning. Single
      # source of truth for "which packages get released" — add a new
      # package here only.
      PACKAGE_DIRS: >-
        packages/core
        packages/orms/typeorm
        packages/orms/prisma
        packages/orms/mongoose
        packages/frameworks/nest
        packages/protocols/graphql
        packages/protocols/mcp
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm's OIDC trusted-publishing exchange needs npm >=11.5.1; the
      # bundled version on some Node builds can lag behind that.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gate as CI — a release never ships on a red build.
      - name: Check
        run: pnpm check

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @kavo/core version $PKG_VERSION" >&2
            exit 1
          fi

      # `pnpm pack` (not `pnpm publish`) does the packaging: it rewrites
      # workspace:^ deps to a real semver range in the tarball. Publishing
      # itself goes through plain `npm publish`, which has stable, GA OIDC
      # trusted-publishing support — pnpm's own `publish` currently 404s
      # under GitHub Actions OIDC (pnpm/pnpm#11513). No npm token anywhere:
      # each package must have a trusted publisher configured on npmjs.com
      # pointing at this repo + this workflow file.
      - name: Pack packages
        run: |
          mkdir -p "$TARBALL_DIR"
          for dir in $PACKAGE_DIRS; do
            (cd "$dir" && pnpm pack --pack-destination "$TARBALL_DIR")
          done

      # Each publish is skipped if that exact name@version is already on
      # the registry, so re-running the job after a partial failure (one
      # package published, a later one failing) doesn't die re-publishing
      # what already succeeded — npm publish itself is not idempotent.
      - name: Publish packages
        run: |
          for dir in $PACKAGE_DIRS; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            TARBALL_PREFIX=$(echo "$NAME" | sed 's/^@//; s/\//-/')
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              npm publish "$TARBALL_DIR/$TARBALL_PREFIX"-*.tgz --access public
            fi
          done

      # Only runs once every publish above succeeded. Attaches the exact
      # published tarballs as release assets and lets GitHub generate the
      # notes from merged PRs since the previous tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            $TARBALL_DIR/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
