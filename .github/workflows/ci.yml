name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/-1", "lts/*", "current"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build + depcruise + test — the same gate as local `pnpm check`.
      - name: Check
        run: pnpm check

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  doc-links:
    name: doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every `docs/**.md` path mentioned by a tracked file, and every link
      # into the docs site, must resolve. Moving a docs directory leaves
      # the mentions behind, and some of the files carrying them (package
      # READMEs, `src/` doc comments, the adopter-facing skills in
      # `extensions/`) ship to npm — so a dead reference is one an adopter
      # follows. Needs no toolchain: pure git+sh.
      - name: Check doc links
        run: ./scripts/check-doc-links.sh
