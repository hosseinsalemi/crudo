name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the checkout — nothing comments, pushes, or
# deploys. pages.yml and publish.yml already declare their permissions; this
# was the one workflow still inheriting the repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pnpm check` runs the whole gate as one command locally. CI splits it in
# two — `build` (compile, types, boundaries, lint) and `test` — because a
# status badge can only report a job, never a step: one combined job can say
# "CI failing" but never "the build is fine, a test regressed". The halves
# are disjoint and their union is exactly `pnpm check`, which
# `tests/ci-workflow.spec.ts` asserts against this file so a step added to
# the gate cannot silently stop running here. They also run in parallel, so
# the split costs no wall-clock.
jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/-1", "lts/*", "current"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `generate` first: the Prisma client it emits is what `build` and
      # `typecheck` compile @kavo/prisma against.
      - name: Build
        run: pnpm run generate && pnpm run build && pnpm run typecheck && pnpm run depcruise && pnpm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/-1", "lts/*", "current"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `build` step: vitest aliases every `@kavo/*` specifier straight to
      # package `src/` (see vitest.config.ts), so the suite never reads
      # `dist/`. `generate` is still required — it emits the Prisma client and
      # pushes the SQLite fixture schema the @kavo/prisma specs run against.
      - name: Test
        run: pnpm run generate && pnpm run test

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  docs:
    name: docs
    runs-on: ubuntu-latest
    # The build itself takes seconds; a bound turns a hung SSR render into a
    # fast red instead of letting it sit on a runner for GitHub's 6-hour
    # default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not path-filtered on purpose: docs/.vitepress/config.mts reads
      # packages/core/package.json at build time, so a packaging change can
      # break the docs build without touching docs/. Builds only — pages.yml
      # still owns deployment.
      - name: Build docs
        run: pnpm docs:build

  doc-links:
    name: doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every `docs/**.md` path mentioned by a tracked file, and every
      # VitePress sidebar link, must resolve. Moving a docs directory leaves
      # the mentions behind, and some of the files carrying them (package
      # READMEs, `src/` doc comments, the adopter-facing skills in
      # `extensions/`) ship to npm — so a dead reference is one an adopter
      # follows. The `docs` job above cannot cover either class: VitePress
      # only resolves links inside the pages it renders, so it never sees a
      # reference from `packages/` and never reads the sidebar config.
      # Needs no toolchain: pure git+sh.
      - name: Check doc links
        run: ./scripts/check-doc-links.sh
